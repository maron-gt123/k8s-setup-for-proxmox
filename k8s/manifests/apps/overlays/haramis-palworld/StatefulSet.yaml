apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: palworld-server

spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: onp-k8s-wk-3

      containers:
        - name: palworld
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
            limits:
              cpu: "8"
              memory: 32Gi