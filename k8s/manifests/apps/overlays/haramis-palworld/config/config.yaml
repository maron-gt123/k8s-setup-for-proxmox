apiVersion: v1
kind: ConfigMap
metadata:
  namespace: palworld
  name: palworld-cm
data:
  DISABLE_GENERATE_SETTINGS: "false"
  PUID: "1000"
  PGID: "1000"
  TZ: Asia/Tokyo
  PLAYERS: "16" # Optional but recommended
  REST_API_ENABLED: "true"
  RCON_ENABLED: "true"
  UPDATE_ON_BOOT: "true"
  BACKUP_ENABLED: "false"
  CROSSPLAY_PLATFORMS: "(Steam,Xbox,PS5,Mac)"
  AUTO_UPDATE_ENABLED: "true"
  AUTO_UPDATE_WARN_MINUTES: "60"
  AUTO_REBOOT_CRON_EXPRESSION: "0 4 * * *"
  AUTO_REBOOT_ENABLED: "true"
  AUTO_PAUSE_ENABLED: "false"
  SERVER_NAME: "haramis-palworld"
  COMMUNITY: "true"
  ENABLE_PERF_THREADING_ARGS: "true"
  WORKER_THREADS_SERVER: "4"
  SERVER_DESCRIPTION: ""
