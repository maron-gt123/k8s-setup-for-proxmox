apiVersion: v1
kind: PersistentVolume
metadata:
  name: world-pv
  labels:
    app: world-pv
spec:
  storageClassName: "nfs-storage"
  capacity:
    storage: 12Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.6.140
    path: /kubanetesu-NFS/haramis-server/palworld